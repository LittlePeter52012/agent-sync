<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 520" role="img" aria-labelledby="title desc">
  <title id="title">agent-sync network topology</title>
  <desc id="desc">A private Hub synchronizes Skills, MCP servers, rules, and capability ownership across AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
