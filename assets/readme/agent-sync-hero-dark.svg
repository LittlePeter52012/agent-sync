      <stop offset="0.5" stop-color="#67E8F9" stop-opacity="1"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
